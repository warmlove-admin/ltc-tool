<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 完全離線版 CSP：僅允許本機資源；允許 blob:/data: 供下載；允許 inline JS/CSS -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' blob: data:;
                 script-src 'self' 'unsafe-inline';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data:;
                 connect-src 'none'">

  <title>LTC 個案全覽輸出工具｜離線版 v1.0（2026-09-01）</title>
  <link rel="icon" href="data:," />

  <link  rel="stylesheet" href="./vendor/tailwind.min.css?v=2025-09-02b">
  <script defer src="./vendor/xlsx.full.min.js?v=2025-09-02b"></script>
  <script defer src="./vendor/papaparse.min.js?v=2025-09-02b"></script>

  <style>
    :root{ --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --bg:#f8fafc }
    body{ color:var(--ink); background:var(--bg) }
    .card{ background:#fff; border:1px solid var(--line); border-radius:1rem; box-shadow:0 4px 14px rgba(15,23,42,.06) }
    .drop{ border:2px dashed var(--line); border-radius:1rem; cursor:pointer }
    .drop.drag{ border-color:#60a5fa; background:#eff6ff }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace }
    .btn{ border:1px solid var(--line); border-radius:.75rem; padding:.55rem 1rem }
    .btn-primary{ background:#0ea5e9; color:#fff; border-color:#0284c7 }
  </style>
</head>
<body>
<header class="max-w-5xl mx-auto px-4 lg:px-6 pt-8 pb-4">
  <h1 class="text-2xl lg:text-3xl font-semibold">LTC 個案全覽輸出工具（離線版） <span class="text-xs align-middle ml-2 px-2 py-0.5 rounded-full border">v1.0</span></h1>
  <p class="mt-2 text-slate-600">上傳 <b>實際服務總表</b>，系統自動依<b>單位＋個管</b>分組，列出每位個案的碼別明細（項目 × 數量 = 金額）與本月總使用額度，不需上傳不通過清冊。</p>
</header>

<main class="max-w-5xl mx-auto px-4 lg:px-6 pb-24">
  <section class="card p-5">
    <h2 class="text-lg font-semibold">① 上傳：實際服務總表（.xlsx 或 .csv）</h2>
    <div id="drop-master" class="drop p-6 text-center mt-2">
      <p>拖曳檔案到此，或點此選檔</p>
      <input id="file-master" class="hidden" type="file" accept=".xlsx,.xls,.csv,.txt" />
      <button class="mt-3 btn" id="btn-pick-master">選擇檔案</button>
      <div id="master-info" class="mt-2 text-sm text-slate-500"></div>
    </div>
    <p class="text-xs text-slate-500 mt-2">規則：自動偵測表頭列（含「姓名」與「身分證字號」）。僅保留 B/C/O/P/V/AA/AG(或 AC)/AL/AQ/AS。</p>
  </section>

  <section class="mt-6 flex gap-3">
    <button id="btn-run" class="btn btn-primary">生成明細</button>
    <button id="btn-copy-all" class="btn" disabled>複製全部</button>
    <button id="btn-download" class="btn" disabled>下載 TXT</button>
    <span id="status" class="text-slate-500 text-sm ml-2"></span>
  </section>

  <section class="card p-5 mt-6">
    <h3 class="font-semibold">篩選</h3>
    <div class="mt-3 grid gap-3 sm:grid-cols-2">
      <label class="block text-sm">
        單位
        <select id="filter-unit" class="mt-1 w-full border rounded px-3 py-2"><option value="__all__">全部</option></select>
      </label>
      <label class="block text-sm">
        個管
        <select id="filter-mgr" class="mt-1 w-full border rounded px-3 py-2"><option value="__all__">全部</option></select>
      </label>
    </div>
  </section>

  <section class="grid lg:grid-cols-2 gap-4 mt-6">
    <div class="card p-5">
      <h3 class="font-semibold">輸出結果（可直接貼 LINE）</h3>
      <div class="mt-3" id="result"></div>
    </div>
    <div class="card p-5">
      <h3 class="font-semibold">提醒 / 錯誤</h3>
      <pre id="warn" class="mono text-sm whitespace-pre-wrap text-rose-600">（尚未產生）</pre>
    </div>
  </section>
</main>

<script>
// ===== 工具 =====
const $ = (s, el=document)=> el.querySelector(s);
const $$ = (s, el=document)=> Array.from(el.querySelectorAll(s));
const fmtMoney = n => (n==null||isNaN(n))? '0' : Number(n).toLocaleString('zh-TW',{maximumFractionDigits:0});
const fmtQty = q => (q==null||isNaN(q))? '0' : String(Math.round(Number(q)));
const onlyNumber = v => { if(v==null) return 0; if(typeof v==='number') return v; const s=String(v).replace(/[,，\s]/g,''); const f=parseFloat(s); return isNaN(f)?0:f; }
const full2half = s => String(s||'').replace(/[！-～]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/[—–‑‒–—―﹣－]/g,'-').replace(/　/g,' ').toUpperCase();
const trim = s => String(s||'').trim();
const upper = s => String(s||'').toUpperCase();

function normalizeUnitName(s){
  if(!s) return s; const str=String(s);
  if(str.includes('天下為公')) return '天公';
  if(str.includes('耆樂居家')) return '耆樂';
  if(str.includes('老五老')) return '老五老';
  if(str.includes('常春藤')) return '常春藤';
  if(str.includes('佳醫')) return '佳醫';
  if(str.includes('居達居家')) return '居達';
  if(str.includes('汐止國泰')) return '汐止國泰醫院';
  if(str.includes('天勤')) return '天勤';
  return s;
}

function isSupportedCode(code){ const c = upper(full2half(code||'')); return c.startsWith('BA') || c.startsWith('GA') || c.startsWith('SC'); }
function cleanCode(code){ return upper(full2half(code||'')).trim(); }

const PRICE = (()=>{
  const map = {
    BA01:260, BA02:195, BA03:35, BA04:130, BA05:310, BA07:325, BA08:500, BA10:155, BA11:195,
    BA12:130, BA13:195, BA14:685, 'BA15-1':195, 'BA15-2':195, BA16:130,
    'BA17A':75, 'BA17B':65, 'BA17C':50, 'BA17D1':50, 'BA17D2':50, 'BA17E':50,
    BA18:200, BA20:175, BA22:130, BA23:200, BA24:220,
    GA09:770, SC09:770
  };
  const alias = {
    'BA151':'BA15-1','BA152':'BA15-2','BA15—1':'BA15-1','BA15—2':'BA15-2',
    'BA05-1':'BA05','BA05—1':'BA05',
    'BA16-1':'BA16','BA16—1':'BA16'
  };
  return {
    get(code){ if(!code) return 0; const c=cleanCode(code).replace(/\s+/g,''); if(map[c]!=null) return map[c]; if(alias[c] && map[alias[c]]!=null) return map[alias[c]]; return 0; },
    has(code){ return this.get(code) > 0 }
  };
})();

function detectHeaderRow(rows){
  const limit=Math.min(rows.length,8);
  for(let i=0;i<limit;i++){
    const v=(rows[i]||[]).map(x=>String(x||'').trim());
    const hasName=v.some(x=>x.includes('姓名'));
    const hasId=v.some(x=>x.includes('身分證')||x.includes('身份證')||x==='ID'||x.includes('證號'));
    if(hasName && hasId) return i;
  }
  return -1;
}

async function parseAny(file, headerRowIndex=1, removeTop=false, filldown=true){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(['xlsx','xls'].includes(ext)){
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const range = XLSX.utils.decode_range(ws['!ref']);
    const rows=[]; for(let R=range.s.r; R<=range.e.r; ++R){ const row=[]; for(let C=range.s.c; C<=range.e.c; ++C){ const addr=XLSX.utils.encode_cell({r:R,c:C}); const cell=ws[addr]; row.push(cell?cell.v:''); } rows.push(row); }
    let hdrIdx = (typeof headerRowIndex === 'number') ? Math.max(1,headerRowIndex)-1 : -1;
    if(removeTop){ rows.shift(); }
    if(ws['!merges']){ for(const m of ws['!merges']){ const v = rows[m.s.r]?.[m.s.c]; for(let r=m.s.r;r<=m.e.r;r++){ for(let c=m.s.c;c<=m.e.c;c++){ if(rows[r] && (rows[r][c]===''||rows[r][c]==null)) rows[r][c]=v; } } } }
    if(filldown){ for(let c=0;c<rows[0].length;c++){ let last=null; for(let r=0;r<rows.length;r++){ if(rows[r][c]!=='' && rows[r][c]!=null){ last=rows[r][c]; } else if(last!=null){ rows[r][c]=last; } } } }
    if(hdrIdx===-1){ hdrIdx=detectHeaderRow(rows); if(hdrIdx<0) hdrIdx=0; }
    const baseHeaders=(rows[hdrIdx]||[]).map(x=>String(x||'').trim());
    const headers=dedupeHeaders(baseHeaders);
    const data=rows.slice(hdrIdx+1).filter(r=> r.some(x=> String(x||'').trim()!==''))
      .map(r=> Object.fromEntries(headers.map((h,i)=> [h, r[i]])) );
    const letters=headers.map((_,i)=> XLSX.utils.encode_col(i));
    return {headers, rows:data, letters, ext:'xlsx'};
  } else {
    const parsed = await new Promise((res,rej)=> Papa.parse(file,{header:false,skipEmptyLines:true,encoding:'UTF-8',complete:res,error:rej}));
    const rows = parsed.data;
    const hdrIdx=Math.max(1,headerRowIndex)-1;
    const baseHeaders=(rows[hdrIdx]||[]).map(x=>String(x||'').trim());
    const headers=dedupeHeaders(baseHeaders);
    const data=rows.slice(hdrIdx+1).filter(r=> r.some(x=> String(x||'').trim()!==''))
      .map(r=> Object.fromEntries(headers.map((h,i)=> [h, r[i]])) );
    const letters=headers.map((_,i)=> XLSX.utils.encode_col(i));
    return {headers, rows:data, letters, ext:'csv'};
  }
}
function dedupeHeaders(arr){ const cnt={}; arr.forEach(h=> cnt[h]=(cnt[h]||0)+1); return arr.map((h,i)=> cnt[h]>1? `${h} [${XLSX.utils.encode_col(i)}]` : h); }

function cleanMaster(raw){
  const want = { B:'姓名', C:'身分證字號', O:'A單位名稱', P:'A個管姓名', V:'B碼', AA:'B碼使用額度', AG:'G碼', AL:'G碼使用額度', AQ:'SC碼', AS:'SC碼使用額度' };
  if(!raw.letters.includes('AG') && raw.letters.includes('AC')){ want['AC'] = 'G碼'; }
  const out=[];
  for(const r of raw.rows){
    const o={}; raw.headers.forEach((h,i)=>{ const L=raw.letters?.[i]; if(want[L]) o[want[L]] = r[h]; });
    for(const k of Object.values(want)) if(!(k in o)) o[k]='';
    o['A單位名稱'] = normalizeUnitName(o['A單位名稱']);
    out.push(o);
  }
  const long=[]; const unknown=new Set();
  const SRC=['B碼','G碼','SC碼'];
  for(const r of out){
    for(const src of SRC){
      const val = r[src]; if(!val) continue;
      for(const seg of splitSegments(val)){
        const pq = parseItemQty(seg); if(!pq || !pq.code) continue;
        const code = cleanCode(pq.code); if(!isSupportedCode(code)) continue;
        const price = PRICE.get(code); if(!price) unknown.add(code);
        long.push({ 姓名:r['姓名'], 身分證字號:full2half(r['身分證字號']), A單位名稱:r['A單位名稱'], A個管姓名:r['A個管姓名'], 服務代碼:code, 數量:Math.round(onlyNumber(pq.qty)), 單價:price, 小計:Math.round(onlyNumber(pq.qty))*price });
      }
    }
  }
  return {wide:out, long, unknown:[...unknown]};
}

const DEFAULT_SEPS=['\n','、','；','，','; ',',','／','/'];
function splitSegments(raw){ const S=full2half(String(raw||'')); let parts=[S]; for(const sep of DEFAULT_SEPS){ const next=[]; for(const p of parts){ next.push(...String(p).split(sep)); } parts=next; } return parts.map(x=>x.trim()).filter(Boolean); }
function parseItemQty(seg){ const s=String(seg||'').trim(); const pats=[/^(\S+)\s*[xX＊×*]\s*(\d+(?:\.\d+)?)/,/^(\S+)\s*[（(]\s*(\d+(?:\.\d+)?)[^)]*[)）]/,/碼別[:：]?\s*(\S+)\s*[,，\s]*數量[:：]?\s*(\d+(?:\.\d+)?)/,/^(\S+)\s*[-–]\s*(\d+(?:\.\d+)?)/]; for(const re of pats){ const m=s.match(re); if(m){ const code=cleanCode(m[1]); if(!isSupportedCode(code)) return null; return {code, qty:Math.round(onlyNumber(m[2]))}; } } const num=s.match(/(\d+(?:\.\d+)?)(?!.*\d)/); const code=cleanCode(s.split(/\s+/)[0]); if(!isSupportedCode(code)) return null; return {code, qty: num?Math.round(onlyNumber(num[1])):0}; }

function buildWideIndex(wide){ const byId=new Map(), byName=new Map(); for(const r of wide){ const id=full2half(r['身分證字號']||''); const name=r['姓名']||''; if(id){ if(!byId.has(id)) byId.set(id,[]); byId.get(id).push(r);} if(name){ if(!byName.has(name)) byName.set(name,[]); byName.get(name).push(r);} } return {byId, byName}; }
function sumMonthTotal(rows){ if(!rows||!rows.length) return 0; let s=0; for(const r of rows){ s += onlyNumber(r['B碼使用額度']) + onlyNumber(r['G碼使用額度']) + onlyNumber(r['SC碼使用額度']); } return s; }

function buildGroups(masterLong, masterWide){
  const idxW=buildWideIndex(masterWide);
  const groups={}; const emptyCases=[];
  for(const r of masterLong){
    const key = r['姓名'] || (r['身分證字號']?'ID:'+r['身分證字號']:'（未填姓名）');
    const wideRows = r['身分證字號']? idxW.byId.get(String(r['身分證字號'])) : idxW.byName.get(r['姓名']);
    const monthTotal = sumMonthTotal(wideRows||[]);
    const unit = r['A單位名稱']||'（未標示單位）';
    const mgr = r['A個管姓名'] ? (r['A個管姓名']+' 個管') : '（未標示個管）';
    groups[unit] ||= {}; groups[unit][mgr] ||= {};
    const bucket = groups[unit][mgr][key] ||= {items:{}, month_total:0};
    bucket.items[r['服務代碼']] ||= {code:r['服務代碼'], qty:0, amount:0};
    bucket.items[r['服務代碼']].qty += r['數量'];
    bucket.items[r['服務代碼']].amount += r['小計'];
    bucket.month_total = monthTotal;
  }
  // 有 long 資料但沒出現的 wide（例如只有額度沒有項目）不輸出
  return groups;
}

function makeBlock(unit, mgr, cases){
  let lines=[];
  lines.push(`${unit}（${mgr}）`);
  let i=1;
  for(const [cname, bucket] of Object.entries(cases)){
    lines.push(`${i}. ${cname}`);
    const items=Object.values(bucket.items).sort((a,b)=> a.code<b.code? -1 : 1);
    for(const it of items){
      lines.push(`     ${it.code} * ${fmtQty(it.qty)} = ${fmtMoney(it.amount)}`);
    }
    lines.push('------------------------------');
    lines.push(`    本月總使用額度  ${fmtMoney(bucket.month_total||0)}`);
    lines.push('');
    i++;
  }
  if(!Object.keys(cases).length){ lines.push('（無個案資料）'); lines.push(''); }
  lines.push('以上個案敬請個管協助額度設定與分配，謝謝!');
  return lines.join('\n');
}

function renderFromGroups(groups){
  const res=$('#result'); res.innerHTML='';
  const warn=$('#warn');
  const uSel=$('#filter-unit').value, mSel=$('#filter-mgr').value;
  const allText=[];
  let blockCount=0, caseCount=0;
  for(const [unit, mgrs] of Object.entries(groups)){
    if(uSel!=='__all__' && unit!==uSel) continue;
    for(const [mgr, cases] of Object.entries(mgrs)){
      if(mSel!=='__all__' && mgr!==mSel) continue;
      const block = makeBlock(unit, mgr, cases); allText.push(block); blockCount++;
      caseCount += Object.keys(cases).length;
      const card=document.createElement('div'); card.className='mb-5';
      const head=document.createElement('div'); head.className='flex items-center justify-between mb-1';
      const title=document.createElement('span'); title.className='font-semibold'; title.textContent=`${unit}（${mgr}）`;
      head.appendChild(title); card.appendChild(head);
      const ta=document.createElement('textarea'); ta.className='mono w-full h-48 p-3 border rounded'; ta.value=block;
      const btn=document.createElement('button'); btn.className='mt-2 btn'; btn.textContent='複製本區'; btn.onclick=()=>{ ta.select(); document.execCommand('copy'); btn.textContent='已複製'; setTimeout(()=>btn.textContent='複製本區',1200); };
      card.appendChild(ta); card.appendChild(btn); res.appendChild(card);
    }
  }
  warn.textContent = blockCount===0 ? '查無符合篩選條件的資料。' : `共 ${blockCount} 個區塊、${caseCount} 位個案。`;
  const all=allText.join('\n\n'); $('#btn-copy-all').disabled = !all.length; $('#btn-download').disabled=!all.length; $('#btn-copy-all').onclick=()=>{ navigator.clipboard.writeText(all); alert('已複製全部輸出'); }; $('#btn-download').onclick=()=>{ const blob=new Blob([all],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='LTC_個案全覽輸出.txt'; a.click(); URL.revokeObjectURL(a.href); };
}

let fileMaster=null;
let masterParsed=null;
let allGroups=null;

async function loadMaster(file){
  $('#status').textContent='讀取實際服務總表…';
  const raw = await parseAny(file, 'auto', false, true);
  const cleaned = cleanMaster(raw);
  masterParsed=cleaned;
  if(cleaned.unknown.length){
    $('#warn').textContent = '發現未定義單價的碼別：\n' + cleaned.unknown.join('、') + '\n請先補齊價目表再重新執行（已停止輸出）。';
    $('#status').textContent='';
    return;
  }
  $('#status').textContent='';
}

function populateFilters(groups){
  const units=[...new Set(Object.keys(groups))].sort();
  const mgrs=[...new Set(Object.values(groups).flatMap(m=>Object.keys(m)))].sort();
  const uSel=$('#filter-unit'), mSel=$('#filter-mgr');
  const curU=uSel.value, curM=mSel.value;
  uSel.innerHTML='<option value="__all__">全部</option>'+units.map(u=>`<option value="${u}">${u}</option>`).join('');
  mSel.innerHTML='<option value="__all__">全部</option>'+mgrs.map(m=>`<option value="${m}">${m}</option>`).join('');
  if(units.includes(curU)) uSel.value=curU; else uSel.value='__all__';
  if(mgrs.includes(curM)) mSel.value=curM; else mSel.value='__all__';
}

async function run(){
  try{
    if(!fileMaster){ alert('請先選擇實際服務總表'); return; }
    await loadMaster(fileMaster);
    if(!masterParsed){ alert('檔案載入失敗，請再試一次'); return; }
    $('#status').textContent='分組與輸出…';
    allGroups = buildGroups(masterParsed.long, masterParsed.wide);
    populateFilters(allGroups);
    $('#filter-unit').onchange=()=> renderFromGroups(allGroups);
    $('#filter-mgr').onchange=()=> renderFromGroups(allGroups);
    renderFromGroups(allGroups);
    $('#status').textContent='完成';
  }catch(e){ console.error(e); alert('處理失敗：'+e.message); }
}

function setupDrop(id, inputId, infoId, onPick){ const box=$(id), input=$(inputId), info=$(infoId); ['dragenter','dragover'].forEach(ev=> box.addEventListener(ev, e=>{e.preventDefault(); box.classList.add('drag')})); ['dragleave','drop'].forEach(ev=> box.addEventListener(ev, e=>{e.preventDefault(); box.classList.remove('drag')})); box.addEventListener('click', ()=> input.click()); box.addEventListener('drop', e=>{ const f=e.dataTransfer.files?.[0]; if(f){ input.files=e.dataTransfer.files; input.dispatchEvent(new Event('change')); }}); input.addEventListener('change', ()=>{ const f=input.files?.[0]; info.textContent = f?`已選擇：${f.name}（${Math.round(f.size/1024)} KB）`:''; if(f) onPick(f); }); }
setupDrop('#drop-master', '#file-master', '#master-info', f=>{ fileMaster=f; masterParsed=null; $('#filter-unit').innerHTML='<option value="__all__">全部</option>'; $('#filter-mgr').innerHTML='<option value="__all__">全部</option>'; });
$('#btn-pick-master').onclick=()=> $('#file-master').click();
$('#btn-run').onclick=run;
</script>
</body>
</html>
